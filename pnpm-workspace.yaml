packages:
  - apps/*
  - packages/*

# Supply chain: take new package versions only after a day, and never run install scripts of dependencies.
minimumReleaseAge: 1440
strictDepBuilds: true

# qs is pulled in by Stryker and has known moderate issues below 6.16.0
overrides:
  qs: ">=6.16.0"
  # Expo's build tooling (xcode, query-string) still asks for versions with known moderate issues.
  "uuid@<11.1.1": "^11.1.1"
  "decode-uri-component@<=0.5.0": ">=0.5.1"
  "@babel/core@<=7.29.0": "^7.29.7"
  "node-forge@<=1.4.0": "^1.4.1"
  "minimatch@<11.0.1": "^11.0.1"
  "glob@>=9.0.0 <14.0.2": "^14.0.2"

allowBuilds:
  esbuild: true

# Advisories with no patched release on npm yet (checked 2026-10-19). Both sit only in Expo's and Metro's
# build tooling (the dev server, config plugins, code signing for builds): neither is in the app we ship nor
# in the API image. Re-check monthly; remove each line when a fixed version exists.
auditConfig:
  ignoreGhsas:
    - GHSA-vfj7-8cjw-p6xm # braces: stack exhaustion on deeply nested patterns (Metro file watching)
    - GHSA-mrhx-c7xc-m3w5 # zod <4.6.6 memory on oversized collections: only @expo/cli's zod 3 (build tooling, no 3.x fix); our code uses 4.6.7
    - GHSA-gcqx-w48m-w2h4 # deepmerge <=4.3.1 prototype poisoning (low): only @expo/config in Expo's CLI; npm's latest is 4.3.1, no patched 4.3.2 yet (checked 2026-10-28)

# expo-camera's CameraView is a class component typed against `react`, which pnpm's strict layout does not link into
# the package, so its props are lost to TypeScript. Linking the app's @types/react to it restores them.
packageExtensions:
  expo-camera:
    peerDependencies:
      "@types/react": "*"
    peerDependenciesMeta:
      "@types/react":
        optional: true
