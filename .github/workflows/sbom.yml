name: SBOM

# An SBOM kept with each release (ASVS V15.1.2, ADR-704, Q-672). The coordinator tags every CranL deploy and store
# build `release-YYYYMMDD-N` and pushes the tag (RUNBOOK, "Database and deploy"); this job writes the production
# dependency list (CycloneDX, from the lockfile) and keeps it as an asset of that tag's GitHub Release, which lasts as
# long as the repository and does not count against Actions storage. A re-run of the same tag replaces the asset.
# Minutes: about 1 a release, about 10 a month.
on:
  push:
    tags:
      - "release-*"

concurrency:
  group: sbom-${{ github.ref }}
  cancel-in-progress: false

permissions: {}

jobs:
  sbom:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          # No cache in a release job (cache poisoning); the lockfile-only SBOM installs nothing.
          package-manager-cache: false

      - name: Write the SBOM from the lockfile
        run: pnpm sbom:generate

      - name: Keep it with the release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
          SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          gh release view "$TAG" >/dev/null 2>&1 || gh release create "$TAG" --verify-tag --notes "SBOM for $SHA"
          gh release upload "$TAG" sbom.cdx.json --clobber
