name: CI

# One job, the cheapest checks first. Drafts are skipped. Roughly 3 minutes per run; about 4 more when the web app or
# the API changes (web build and browser tests, scoped by scripts/ci-scope.mjs).
on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}-${{ github.event.pull_request.draft || false }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  checks:
    if: github.event_name != 'pull_request' || !github.event.pull_request.draft
    runs-on: ubuntu-24.04
    # Tests and checks take about 11 minutes and the browser tests 12 to 15 (see their step), plus the audit and builds.
    timeout-minutes: 35
    services:
      postgres:
        image: postgres:17-alpine@sha256:b0f9560a2de083e2cc7382e75f808c7381a32852a7ec49117deedb300e552b24
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20
      redis:
        image: redis:8-alpine@sha256:3811787313eba226a2ef38658c6ccb91cd5e110edc89c37767de373120a0e5a0
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20
    env:
      TEST_DATABASE_URL: postgres://postgres:postgres@127.0.0.1:5432/postgres
      TEST_REDIS_URL: redis://127.0.0.1:6379
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Secret scan (gitleaks 8.30.1)
        run: |
          set -euo pipefail
          curl -sSfL -o gitleaks.tar.gz "https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz"
          echo "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb  gitleaks.tar.gz" | sha256sum -c -
          tar -xzf gitleaks.tar.gz gitleaks
          ./gitleaks git --redact --no-banner --verbose .

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Lint, format, types, tests
        run: pnpm ci:changed

      - name: API build (the bundle the Docker image ships)
        run: pnpm --filter @questify/api build

      - name: Dependency audit
        run: pnpm audit

      - name: Which heavier checks this change needs
        id: scope
        env:
          BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: node scripts/ci-scope.mjs "$BASE" >> "$GITHUB_OUTPUT"

      - name: Cache the web build
        if: steps.scope.outputs.web == 'true' || steps.scope.outputs.e2e == 'true'
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: apps/web/.next/cache
          key: next-${{ hashFiles('pnpm-lock.yaml') }}-${{ hashFiles('apps/web/src/**', 'packages/shared/src/**') }}
          restore-keys: next-${{ hashFiles('pnpm-lock.yaml') }}-

      - name: Web build
        if: steps.scope.outputs.web == 'true' || steps.scope.outputs.e2e == 'true'
        run: pnpm --filter @questify/web build
        env:
          NEXT_TELEMETRY_DISABLED: "1"

      - name: Cache the test browser
        if: steps.scope.outputs.e2e == 'true'
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ms-playwright
          key: playwright-chromium-${{ hashFiles('pnpm-lock.yaml') }}

      - name: Browser tests (dashboard, console and public pages on desktop and phone, both languages)
        if: steps.scope.outputs.e2e == 'true'
        # The runner image already has Chromium's libraries; --with-deps only added fonts and xvfb through apt,
        # which a throttled mirror stretched to 11 minutes (runs 40012088097, 40014730879).
        # 171 specs ran 8.0 minutes on 2026-10-27 (run 40502683226) and hit the old 8-minute limit; the step took 10.4 minutes
        # on 2026-10-30 (run 40979237093). T-599b's layout check then grew to 5.7 minutes of its own (fixed waits for state
        # colours and the network) and run 40993429874 was cancelled at 12. It now waits by event and takes 3.1 minutes
        # (desktop 1.7, phone 1.4). All 230 specs, 1 worker, CI=1, took 16.4 minutes on the developer PC (T-599c); the runner
        # took 0.7 to 0.9 times the PC's time, so the step is expected at 12 to 15 minutes, and 18 leaves room.
        timeout-minutes: 18
        run: |
          set -euo pipefail
          pnpm --filter @questify/web exec playwright install chromium
          pnpm --filter @questify/web e2e
        env:
          NEXT_TELEMETRY_DISABLED: "1"

      - name: Keep the browser test traces on failure
        if: failure() && steps.scope.outputs.e2e == 'true'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: e2e-results
          path: apps/web/.e2e/results
          retention-days: 5
          include-hidden-files: true
