# Prometheus of the Questify monitoring app (T-018b, ADR-626). The API pushes its metrics to the OTLP receiver
# (--web.enable-otlp-receiver, /api/v1/otlp/v1/metrics), so each sample keeps the time the API reported it, which the loop
# alerts depend on. Prometheus evaluates the alert rules and hands firing alerts to the Alertmanager in the same container.
#
# No secret is in this file: the scrape password is read from a file that `render-config.sh` writes at start.

global:
  scrape_interval: 30s
  # The rule unit tests (ops/alerts/questify.rules.test.yml) run at this interval.
  evaluation_interval: 15s

rule_files:
  - /etc/prometheus/questify.rules.yml

alerting:
  alertmanagers:
    - static_configs:
        - targets: ["127.0.0.1:9093"]

# Names become Prometheus names the way docs/SLO.md section 3 says (dots to underscores, `_total`, `_seconds`), which is
# what the alert rules and the dashboard use; `service.name` becomes `job` and `service.instance.id` `instance`. No
# resource attribute is promoted to a label on every series (they stay on `target_info`), and no `otel_scope_*` label is
# added. Prometheus cannot filter the attributes it is sent (ADR-626): the API's closed list is the filter.
otlp:
  translation_strategy: UnderscoreEscapingWithSuffixes
  promote_resource_attributes: []
  promote_scope_metadata: false

# Only the stack itself is scraped: the API pushes its metrics. These two jobs feed the "Monitoring stack" row of the
# dashboard (rule failures, undelivered notifications, series count, disk).
scrape_configs:
  - job_name: prometheus
    basic_auth:
      username: questify-metrics
      password_file: /tmp/metrics-password
    static_configs:
      - targets: ["127.0.0.1:9090"]
  - job_name: alertmanager
    static_configs:
      - targets: ["127.0.0.1:9093"]
